<!doctype html><html><head><meta charset="utf-8"><script src="../data.js"></script></head><body>
<iframe id="f" src="../index.html" style="width:1000px;height:800px"></iframe>
<pre id="out"></pre>
<script>
const results=[]; let w,d;
const ok=(name,cond,info="")=>results.push({name,pass:!!cond,info:String(info)});
const $=(s)=>d.querySelector(s), $$=(s)=>[...d.querySelectorAll(s)];
const slots=()=>Object.fromEntries($$('.post').map(b=>[b.dataset.slot, b.querySelector('.person-name')?.textContent||null]));
const filled=()=>$('#filledCount').textContent, sd=()=>$('#sdCount').textContent, capLeft=()=>$('#capLeft').textContent;
const byName=(n)=>CANDIDATES.find(c=>c.name===n);
const partyOf=(n)=>byName(n)?.party;
const openSlot=(id)=>{ $('.post[data-slot="'+id+'"]').click(); };
const esc=()=>d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape'}));
const findRow=(name)=>$$('.candidate-row').find(r=>r.querySelector('.person-name').textContent===name);
const pick=(name)=>{ let row=findRow(name); if(!row && $('.candidate-showall')){ $('.candidate-showall').click(); row=findRow(name); } if(!row) return 'norow'; if(row.disabled||row.getAttribute('aria-disabled')==='true') return 'disabled'; row.click(); return 'clicked'; };
const load=()=>new Promise(r=>{const f=document.getElementById('f'); f.onload=()=>{w=f.contentWindow; d=f.contentDocument; r();}; });
const reload=(keepHash)=>{ const f=document.getElementById('f'); const p=load(); if(!keepHash) f.contentWindow.history.replaceState(null,'',f.contentWindow.location.pathname); f.contentWindow.location.reload(); return p; };
const counts=()=>{const s=slots(); const c={M:0,L:0,KD:0,SD:0,empty:0}; for(const v of Object.values(s)){ if(!v) c.empty++; else c[partyOf(v)]++; } return c;};
const dupes=()=>{const v=Object.values(slots()).filter(Boolean); return v.filter((x,i)=>v.indexOf(x)!==i);};
const seatClasses=(sel)=>$$(sel+' .seat').map(e=>['SD','M','KD','L','empty'].find(c=>e.classList.contains(c)));

(async()=>{
 await load(); w.localStorage.clear(); await reload();
 // 1 initial
 ok('initial: 1/24, SD 0, 11 platser kvar', filled()==='1 / 24' && sd()==='0' && capLeft()==='11', filled()+' '+sd()+' '+capLeft());
 ok('initial: PM is Kristersson and fixed', slots().pm==='Ulf Kristersson' && $('.post[data-slot="pm"]').classList.contains('fixed'));
 ok('initial: L toggle off', $('#lToggle').getAttribute('aria-checked')==='false');
 ok('initial: no cap state, result hidden, CTA hidden', !$('#statusbar').classList.contains('at-cap') && $('#capLine').hidden && $('#result').hidden && $('#shareCta').hidden);
 ok('sender named in hero and footer', $('.sender').textContent.includes('Centerstudenter') && $('.footer-sender').textContent.includes('Centerstudenter'));
 ok('desktop share disabled at 1/24', $('#shareTopBtn').disabled);
 ok('initial: hero grid 24 seats, 1 M + 23 empty', seatClasses('#heroSeats').length===24 && seatClasses('#heroSeats').filter(c=>c==='empty').length===23);
 ok('initial: meter 24 segments, non-SD fills from the right', $$('#meterTrack .seg').length===24 && $$('#meterTrack .seg')[23].classList.contains('M'));
 ok('initial: no saved-state toast', $('#toast').hidden);
 openSlot('pm'); ok('PM card is not a button and does not open picker', $('.post[data-slot="pm"]').tagName==='DIV' && $('#modalBackdrop').hidden);
 // 2 picker with L off
 openSlot('eu');
 ok('picker opens with title', !$('#modalBackdrop').hidden && $('#modalTitle').textContent==='EU-minister');
 ok('picker: page behind is inert', $('main').inert===true && $('header').inert===true);
 ok('picker: no L candidates and no L tab when L off', !$$('.candidate-row .person-name').some(e=>partyOf(e.textContent)==='L') && !$$('.party-tab').some(t=>t.dataset.party==='L'));
 ok('picker: tabs expose aria-pressed', $$('.party-tab').find(t=>t.dataset.party==='ALL').getAttribute('aria-pressed')==='true');
 ok('picker: never offers the fixed PM', !$$('.candidate-row .person-name').some(e=>e.textContent==='Ulf Kristersson'));
 ok('picker: rest collapsed behind Visa alla', !!$('.candidate-showall') && $('.candidate-showall').textContent.startsWith('Visa alla') && !$$('li').some(l=>l.textContent==='Alla'));
 $('.candidate-showall').click();
 ok('picker: "Alla" group sorted by surname after expanding', (()=>{const lis=$$('li'); const start=lis.findIndex(l=>l.textContent==='Alla'); const n=lis.slice(start+1).map(l=>l.querySelector('.person-name')?.textContent).filter(Boolean).map(x=>x.split(' ').pop()); return n.length>20 && n.every((x,i)=>i===0||n[i-1].localeCompare(x,'sv')<=0);})());
 ok('picker: Töm posten hidden for empty slot', $('#clearSlotBtn').hidden);
 ok('picker: suggested group first, with the current EU minister', $('.candidate-group')?.textContent==='Föreslagna för posten' && $$('li').slice(0, $$('li').findIndex(l=>l.textContent==='Alla')).some(l=>l.textContent.includes('Jessica Rosencrantz')), $$('.candidate-group').map(g=>g.textContent).join('|'));
 $('#candidateSearch').value='soder'; $('#candidateSearch').dispatchEvent(new w.Event('input'));
 ok('picker: search folds diacritics (soder finds Söder)', $$('.candidate-row .person-name').some(e=>e.textContent==='Björn Söder') && !$('.candidate-group'), $$('.candidate-row .person-name').map(e=>e.textContent).join(','));
 $('#candidateSearch').value='åkes'; $('#candidateSearch').dispatchEvent(new w.Event('input'));
 ok('picker: search filters', $$('.candidate-row').length===1 && $('.candidate-row .person-name').textContent==='Jimmie Åkesson', $$('.candidate-row').length);
 ok('assign SD', pick('Jimmie Åkesson')==='clicked' && slots().eu==='Jimmie Åkesson' && sd()==='1' && filled()==='2 / 24');
 ok('picker closes, page no longer inert, focus returns to post card', $('#modalBackdrop').hidden && $('main').inert===false && d.activeElement?.dataset?.slot==='eu', d.activeElement?.outerHTML?.slice(0,60));
 ok('toast shown with undo for a single pick', !$('#toast').hidden && $('#toastMsg').textContent.includes('Åkesson') && !$('#toastAction').hidden);
 ok('hero grid: SD seat first', seatClasses('#heroSeats')[0]==='SD' && seatClasses('#heroSeats')[1]==='M');
 // 3 fill non-SD up to cap: PM + 11 more = 12
 const nonSDNames=CANDIDATES.filter(c=>(c.party==='M'||c.party==='KD') && c.id!=='kristersson').map(c=>c.name);
 const openIds=PORTFOLIOS.filter(p=>!p.fixed && p.id!=='eu').map(p=>p.id);
 let placed=0;
 for(let i=0;i<11;i++){ openSlot(openIds[i]); if(pick(nonSDNames[i])==='clicked') placed++; }
 ok('11 non-SD placed (12 incl PM)', placed===11 && counts().M+counts().KD===12 && capLeft()==='0', JSON.stringify(counts())+' '+capLeft());
 ok('cap state at 12 non-SD: gold bar, cap line, empty cards marked only-SD', $('#statusbar').classList.contains('at-cap') && !$('#capLine').hidden && $$('.post.only-sd').length===counts().empty && $('#result').hidden, $$('.post.only-sd').length+' vs '+counts().empty);
 ok('cap line names SD as the taker and keeps the counts visible', $('#capLine').textContent.includes('Sverigedemokraternas') && $('#capLine').textContent.includes(String(counts().empty)) && w.getComputedStyle($('#statusLine')).display!=='none', $('#capLine').textContent);
 openSlot(openIds[11]);
 ok('at cap: blocked message shown', !$('#modalBlocked').hidden);
 ok('at cap: SD tab preselected for empty post', $$('.party-tab').find(t=>t.dataset.party==='SD').getAttribute('aria-pressed')==='true');
 $$('.party-tab').find(t=>t.dataset.party==='ALL').click();
 if($('.candidate-showall')) $('.candidate-showall').click();
 ok('at cap: non-SD rows aria-disabled, described, still focusable', $$('.candidate-row').filter(r=>partyOf(r.querySelector('.person-name').textContent)!=='SD').every(r=>r.getAttribute('aria-disabled')==='true' && r.getAttribute('aria-describedby')==='modalBlocked' && !r.disabled));
 ok('at cap: tabs show counts and SD tab first', $$('.party-tab').every(t=>t.dataset.party==='ALL' || /\d/.test(t.textContent)) && $('#partyTabs').classList.contains('sd-first'));
 ok('at cap: SD rows enabled', $$('.candidate-row').filter(r=>partyOf(r.querySelector('.person-name').textContent)==='SD').every(r=>r.getAttribute('aria-disabled')!=='true'));
 ok('at cap: 13th non-SD refused', pick(nonSDNames[11])==='disabled' && counts().M+counts().KD===12);
 ok('at cap: SD still assignable', pick('Henrik Vinge')==='clicked' && slots()[openIds[11]]==='Henrik Vinge');
 // 4 swap non-SD occupant at cap
 openSlot(openIds[0]);
 const swapRes=pick(nonSDNames[11]);
 ok('at cap: swapping occupant non-SD→non-SD allowed', swapRes==='clicked' && slots()[openIds[0]]===nonSDNames[11] && counts().M+counts().KD===12, swapRes);
 // 5 move
 openSlot(openIds[1]);
 if($('.candidate-showall')) $('.candidate-showall').click();
 const elsewhereRow=findRow(nonSDNames[11]);
 ok('picker marks person seated elsewhere', elsewhereRow?.classList.contains('elsewhere') && elsewhereRow.textContent.includes('sitter just nu'));
 pick(nonSDNames[11]);
 ok('moving a person empties old slot', slots()[openIds[0]]===null && slots()[openIds[1]]===nonSDNames[11] && dupes().length===0);
 // 6 clear
 openSlot(openIds[1]); ok('Töm posten visible for filled slot', !$('#clearSlotBtn').hidden); $('#clearSlotBtn').click();
 ok('clear empties slot & closes', slots()[openIds[1]]===null && $('#modalBackdrop').hidden);
 // 7 Escape + focus trap
 openSlot('eu');
 const foc=[...$('.modal').querySelectorAll('button:not([disabled]),input')].filter(n=>n.offsetParent!==null);
 foc[foc.length-1].focus(); d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Tab',bubbles:true}));
 ok('Tab from last focusable wraps to first', d.activeElement===foc[0], d.activeElement?.className);
 esc(); ok('Escape closes picker', $('#modalBackdrop').hidden);
 // 8 persistence + saved toast
 const before=JSON.stringify(slots()); await reload();
 ok('state persists across reload', JSON.stringify(slots())===before);
 ok('saved-state toast offers Börja om', !$('#toast').hidden && $('#toastAction').textContent==='Börja om');
 // 9 reset via bottom button, then undo
 $('#resetBottomBtn').click(); ok('reset leaves only PM', filled()==='1 / 24' && counts().empty===23);
 ok('reset toast offers Ångra', !$('#toastAction').hidden && $('#toastAction').textContent==='Ångra');
 $('#toastAction').click(); ok('undo restores government', JSON.stringify(slots())===before);
 $('#resetBottomBtn').click();
 // 10 example fill, L off
 $('#exampleBtn').click();
 ok('example (L off): 24/24, SD 12, no L', filled()==='24 / 24' && counts().SD===12 && counts().L===0, JSON.stringify(counts()));
 ok('complete: result visible, no cap state, CTA visible, toast suppressed', !$('#result').hidden && !$('#statusbar').classList.contains('at-cap') && !$('#shareCta').hidden && d.body.classList.contains('has-cta') && $('#toast').hidden);
 ok('result carries sender line and save-image button', $('.result-sender').textContent.includes('Centerstudenter') && !!$('#saveImageBtn'));
 ok('URL hash carries the government', /#g=[0-9a-z-]{48}/.test(w.location.hash), w.location.hash);
 const sharedHash=w.location.hash; const sharedSlots=JSON.stringify(slots()); w.localStorage.clear(); await reload(true);
 ok('shared link reopens the same government from the hash alone', JSON.stringify(slots())===sharedSlots && !$('#result').hidden && $('#toast').hidden);
 ok('result headline says 12 av 24', $('#resultTitle').textContent.startsWith('12 av 24'), $('#resultTitle').textContent);
 ok('result grid 24 seats, 12 SD first', seatClasses('#resultSeats').length===24 && seatClasses('#resultSeats').slice(0,12).every(c=>c==='SD'));
 ok('result names SD holders of heavy posts', $('#resultNote').textContent.includes('Justitie') && $('#resultNote').textContent.includes('Tobias Andersson'), $('#resultNote').textContent);
 ok('CTA label carries the count', $('#shareCtaBtn').textContent.includes('12 av 24'));
 ok('example over empty state: no undo in result card', $('#resultUndoBtn').hidden);
 // 11 example twice → identical state → still no undo; random then example → undo in card
 $('#exampleBtn').click(); ok('example twice: identical state offers no undo', $('#resultUndoBtn').hidden);
 $('#randomBtn').click(); const afterRandom=JSON.stringify(slots()); $('#exampleBtn').click(); ok('example over a different government offers Ångra in the result card', !$('#resultUndoBtn').hidden);
 $('#resultUndoBtn').click(); ok('result-card undo restores the previous government', JSON.stringify(slots())===afterRandom);
 $('#exampleBtn').click();
 // 12 L on
 $('#lToggle').click(); ok('L toggle on', $('#lToggle').getAttribute('aria-checked')==='true');
 $('#exampleBtn').click(); ok('example (L on): 4 L, SD 12', counts().L===4 && counts().SD===12, JSON.stringify(counts()));
 openSlot('eu'); if($('.candidate-showall')) $('.candidate-showall').click(); ok('picker shows L candidates and L tab when on', $$('.candidate-row .person-name').some(e=>partyOf(e.textContent)==='L') && $$('.party-tab').some(t=>t.dataset.party==='L')); esc();
 // 13 L off → seats emptied, undo offered and works
 $('#lToggle').click(); ok('L off empties L seats', counts().L===0 && counts().empty===4 && counts().SD===12, JSON.stringify(counts()));
 ok('L off toast offers Ångra', !$('#toastAction').hidden && $('#toastMsg').textContent.includes('4 poster'), $('#toastMsg').textContent);
 $('#toastAction').click(); ok('undo restores L seats and toggle', counts().L===4 && $('#lToggle').getAttribute('aria-checked')==='true');
 $('#lToggle').click();
 // 14 random x30 invariants
 let bad=[]; const guaranteed=GUARANTEED_SD_IDS.map(id=>CANDIDATES.find(c=>c.id===id).name);
 for(let i=0;i<30;i++){ $('#randomBtn').click(); const c=counts(); const s=Object.values(slots());
   if(!(c.SD===12 && c.empty===0 && c.L===0 && dupes().length===0 && guaranteed.every(g=>s.includes(g)))) bad.push(JSON.stringify(c)); }
 ok('random x30 (L off): 24/24, exactly 12 SD, 0 L, no dupes, guaranteed SD present', bad.length===0, bad.slice(0,3).join(' | '));
 $('#lToggle').click(); let sawL=false, bad2=[];
 for(let i=0;i<30;i++){ $('#randomBtn').click(); const c=counts(); if(c.L>0) sawL=true; if(!(c.SD===12&&c.empty===0&&dupes().length===0)) bad2.push(JSON.stringify(c)); }
 ok('random x30 (L on): invariants hold and L appears sometimes', bad2.length===0 && sawL);
 // 15 share text
 let captured=null; Object.defineProperty(w.navigator,'clipboard',{value:{writeText:async t=>{captured=t;}}}); w.prompt=(m,t)=>{captured=t;};
 $('#shareBtn').click(); for(let i=0;i<40 && !captured;i++) await new Promise(r=>setTimeout(r,50));
 ok('share text leads with the count, ends with hash link and sender', captured && captured.startsWith('12 av 24 statsråd') && captured.includes('blagulregering.se/#g=') && captured.includes('Centerstudenter') && captured.split('\n').filter(l=>/^[A-ZÅÄÖ].*: /.test(l) && !l.startsWith('Bygg')).length===24, (captured||'').split('\n')[0]);
 // 16 storage edge cases
 w.localStorage.setItem('blagulregering-state-v2','{not json'); await reload();
 ok('corrupt localStorage tolerated', filled()==='1 / 24');
 w.localStorage.setItem('blagulregering-state-v2',JSON.stringify({slots:{eu:'nonexistent-id',finans:'sjostedt',pm:'akesson'},lInParliament:true})); await reload();
 ok('unknown candidate id ignored, PM never overridden', slots().eu===null && slots().finans==='Oscar Sjöstedt' && slots().pm==='Ulf Kristersson' && $('#lToggle').getAttribute('aria-checked')==='true', JSON.stringify(slots()));
 document.getElementById('out').textContent='RESULTS'+JSON.stringify(results);
})().catch(e=>{document.getElementById('out').textContent='RESULTS'+JSON.stringify(results.concat([{name:'HARNESS ERROR',pass:false,info:e.stack}]));});
</script></body></html>
